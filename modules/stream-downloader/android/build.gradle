plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.streamdownloader'
version = '1.0.0'

android {
  namespace "expo.modules.streamdownloader"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // FFmpegKit'in bakımdaki çatalı (LGPL-3.0). Orijinal com.arthenica paketleri arşivli.
  implementation "dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.9"

  // expo-file-system da aynı sürümü taşır; açıkça bağlıyoruz ki derleme classpath'i netleşsin.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"

  // Coroutines expo-modules-core üzerinden gelir.
  testImplementation "junit:junit:4.13.2"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.9.2"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
  // Birim testlerinde android.jar'daki org.json yerine gerçek uygulama.
  testImplementation "org.json:json:20231013"
}
